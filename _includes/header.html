<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.author.name }}, home">
      <span class="brand__mark" aria-hidden="true">{{ site.author.initials }}</span>
      <span class="brand__name">{{ site.author.short_name }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.navigation %}
      <a href="{{ item.url | relative_url }}"{% if item.url == page.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Light / dark theme">
      {%- include icon.html name="moon" class="icon--moon" -%}
      {%- include icon.html name="sun" class="icon--sun" -%}
    </button>
  </div>
</header>
